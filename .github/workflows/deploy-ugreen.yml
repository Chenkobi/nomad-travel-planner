name: Deploy to UGREEN

on:
  workflow_dispatch:
    inputs:
      clear_intake:
        description: "Permanently delete all intake email data"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tripy-production
  cancel-in-progress: false

env:
  CONTAINER_NAME: tripy-bot
  ENV_FILE: /home/Kobic101/tripy-bot/.env
  DATA_VOLUME: /home/Kobic101/tripy-data:/app/data
  DATA_DIR: /home/Kobic101/tripy-data
  UPLOADS_VOLUME: /home/Kobic101/tripy-uploads:/app/uploads
  EMAIL_VOLUME: /home/Kobic101/tripy-email:/app/email

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, tripy, ugreen]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests before deployment
        run: python3 -m unittest discover -s telegram-bot -p 'test_*.py' -q

      - name: Audit live email corpus (aggregate only)
        run: python3 tools/audit_intake_corpus.py /home/Kobic101/tripy-email

      - name: Build release image
        env:
          RELEASE_TAG: tripy-bot:${{ github.sha }}
        run: docker build --pull -t "$RELEASE_TAG" .

      - name: Replace container and verify health
        env:
          RELEASE_TAG: tripy-bot:${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          previous_image=""
          if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            previous_image="$(docker container inspect --format '{{.Config.Image}}' "$CONTAINER_NAME")"
          fi

          run_release() {
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file "$ENV_FILE" \
              -e TRIPY_SETUP_TOKEN="${{ secrets.TRIPY_SETUP_TOKEN }}" \
              -e TRIPY_DATA_FILE=/app/data/trip-data.json \
              -e TRIPY_UPLOAD_DIR=/app/uploads \
              -e TRIPY_EMAIL_DIR=/app/email \
              -p 8787:8787 \
              -v "$DATA_VOLUME" \
              -v "$UPLOADS_VOLUME" \
              -v "$EMAIL_VOLUME" \
              "$1"
          }

          mkdir -p "$DATA_DIR"
          if [[ ! -s "$DATA_DIR/trips.json" ]] && docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            docker cp "$CONTAINER_NAME:/app/data/trips.json" "$DATA_DIR/trips.json" >/dev/null 2>&1 || true
            if [[ ! -s "$DATA_DIR/trips.json" ]]; then
              docker cp "$CONTAINER_NAME:/app/trips.json" "$DATA_DIR/trips.json" >/dev/null 2>&1 || true
            fi
          fi

          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          run_release "$RELEASE_TAG" >/dev/null

          healthy=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8787/healthz >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [[ "$healthy" != true ]]; then
            echo "New container failed health check" >&2
            docker logs --tail 120 "$CONTAINER_NAME" || true
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            if [[ -n "$previous_image" ]] && docker image inspect "$previous_image" >/dev/null 2>&1; then
              run_release "$previous_image" >/dev/null
              echo "Rolled back to $previous_image" >&2
            fi
            exit 1
          fi

          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8787/healthz
          printf '\nDeployment verified: %s\n' "$RELEASE_TAG"

      - name: Verify latest email state after recovery (aggregate only)
        run: docker exec "$CONTAINER_NAME" python3 /app/tools/audit_intake_corpus.py /app/email --latest-only --wait-terminal 90 --trip-data-file /app/data/trip-data.json

      - name: Permanently clear intake mailbox (explicit dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.clear_intake == true
        run: |
          set -Eeuo pipefail
          result="$(docker exec "$CONTAINER_NAME" python3 -c 'import sys; sys.path.insert(0, "/app/telegram-bot"); import server; removed = server.clear_email_intake_permanently(); print({"deleted": removed, "intake_empty": not server.load_email_index(), "trips": len(server.load_trips())})')"
          printf '%s\n' "$result"
          [[ "$result" == *"'intake_empty': True"* ]]
